<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  トークンの書体の並び（font-body・font-ui）にある Noto Serif JP・Noto Sans JP は、
  Debian/Ubuntu の fonts-noto-cjk では Noto Serif CJK JP・Noto Sans CJK JP という名前で入る。
  トークンの並びは変えず、ここで同じ書体に当てる
-->
<fontconfig>
  <alias binding="same">
    <family>Noto Serif JP</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans JP</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
