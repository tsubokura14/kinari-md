name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: テスト・Lint・型チェック
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 手元と同じ Node のメジャー版
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  visual:
    name: 画像を比べるテスト
    runs-on: ubuntu-latest
    # docs/design.md の「見本のページの画像は、日本語の書体を入れた Playwright のイメージで撮って比べる」。
    # 手元と同じく scripts/playwright-docker.mjs が docker/playwright/ のイメージを作り、その中で走らせる
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # スクリプトが、入れた @playwright/test の版を読んでイメージを作るため
      - run: npm ci
      # CI では基準の画像を更新しない（--update-snapshots=none。撮り直しは手元で行い、PR に入れる）
      - run: npm run test:visual
      # 基準・今回・差分の画像は HTML レポートに入る
      - name: 失敗したときのレポートを残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
